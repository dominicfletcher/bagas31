  <!-- Card 1 -->
  <rect x="284" y="122" width="236" height="114" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="300" y="138" width="38" height="38" rx="8" fill="#2563eb" />
  <rect x="311" y="149" width="7" height="7" fill="#ffffff" />
  <rect x="320" y="149" width="7" height="7" fill="#ffffff" />
  <rect x="311" y="158" width="7" height="7" fill="#ffffff" />

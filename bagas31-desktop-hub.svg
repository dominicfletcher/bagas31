  <rect x="284" y="254" width="236" height="116" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="300" y="270" width="38" height="38" rx="8" fill="#7c3aed" />
  <circle cx="319" cy="289" r="9" fill="none" stroke="#ffffff" stroke-width="2.4" />
  <circle cx="319" cy="289" r="3" fill="#ffffff" />

  <path d="M563 295 L563 285 M571 295 L571 280 M579 295 L579 288" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
  <text x="602" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111827">System Diagnostics</text>
  <text x="602" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Cleanup &amp; memory checks</text>

  <text x="246" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#dbeafe">Desktop Software &amp; Windows Utilities Hub</text>
  <circle cx="758" cy="74" r="5" fill="#93c5fd" />

  <text x="348" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#6d28d9" text-anchor="middle">Clean Guides</text>

  <!-- Card 4 -->
  <rect x="536" y="254" width="236" height="116" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />

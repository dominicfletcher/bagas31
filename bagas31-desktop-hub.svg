  <path d="M565 157 L571 163 L580 151" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="602" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Office &amp; File Suites</text>
  <text x="602" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">PDF, archive &amp; doc readers</text>

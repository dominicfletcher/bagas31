  <text x="132" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">System Utilities</text>
  <text x="132" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Office &amp; Docs</text>
  <text x="132" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Audio Editors</text>
  <text x="132" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Design &amp; Graphics</text>
  <text x="132" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Screen Capture</text>
  <text x="132" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Security Tools</text>
  <text x="132" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Dev Workflow</text>


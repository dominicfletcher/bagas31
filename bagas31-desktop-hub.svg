<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Bagas31 desktop software directory and Windows productivity workspace">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="header1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="sh1" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="880" height="440" rx="14" fill="url(#bg1)" />
  <circle cx="790" cy="70" r="95" fill="#dbeafe" opacity="0.6" />
  <circle cx="90" cy="370" r="85" fill="#e0f2fe" opacity="0.7" />

  <!-- Main Desktop Window Mockup -->
  <g filter="url(#sh1)">
    <rect x="80" y="46" width="720" height="348" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M80 58 C80 51.4 85.4 46 92 46 L788 46 C794.6 46 800 51.4 800 58 L800 102 L80 102 Z" fill="url(#header1)" />
  </g>

